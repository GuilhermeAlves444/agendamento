<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendamento de Cirurgias</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      margin: 0;
      padding: 40px 20px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 28px;
    }

    form {
      max-width: 750px;
      margin: auto;
      background: #ffffff;
      padding: 35px 45px;
      border-radius: 15px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #34495e;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccd1d9;
      border-radius: 10px;
      font-size: 15px;
      background-color: #f8f9fa;
      transition: border 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      width: 48%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.02);
    }

    button + button {
      margin-left: 4%;
      background-color: #28a745;
    }

    button + button:hover {
      background-color: #1e7e34;
    }

    #output {
      margin-top: 40px;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .comprovante {
      font-size: 16px;
      color: #2d3436;
      position: relative;
      z-index: 1;
    }

    .titulo {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      color: #2d3436;
    }

    .header1 {
      font-size: 24px;
      text-align: center;
      font-weight: bold;
      color: #000000;
      margin-bottom: -15px;
    }

    .header {
      font-size: 14px;
      text-align: center;
      font-weight: bold;
      color: #636e72;
    }

    .linha {
      border-bottom: 3px solid #000000;
      margin: 25px 0;
    }

    .logo {
      text-align: center;
      margin-bottom: -20px;
      margin-top: -20px;
    }

    .logo img {
      width: 220px;
    }

    .rodape {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #636e72;
      margin-top: 30px;
      position: relative;
      z-index: 1;
    }

    .marca-info {
      font-style: italic;
    }

    .horario-gerado {
      text-align: right;
    }

    @media (max-width: 600px) {
      form, #output {
        padding: 20px;
      }

      button {
        width: 100%;
        margin-left: 0;
        margin-bottom: 10px;
      }

      button + button {
        margin-left: 0;
      }
    }
  </style>  
</head>
<body>
  <h2>Gerar Comprovante de Agendamento</h2>
  <form id="agendamentoForm">
    <label>Nome do Paciente:</label>
    <input type="text" id="nome" required />

    <label>Nome da Mãe:</label>
    <input type="text" id="nomeMae" required />

    <label>Data de Nascimento:</label>
    <input type="date" id="nascimento" required />

    <label>Contato:</label>
    <input type="text" id="contato" required />

    <label>Unidade Básica de Saúde (ESF):</label>
    <select id="endereco" required>
      <option value="">Selecione a unidade do paciente...</option>
      <option value="ALTO BRILHANTE I">PSF ALTO BRILHANTE I</option>
      <option value="ALTO BRILHANTE II">PSF ALTO BRILHANTE II</option>
      <option value="ANA ALVES">PSF ANA ALVES</option>
      <option value="BEZERRA E SOUSA">PSF BEZERRA E SOUSA</option>
      <option value="SAO GERALDO I">PSF SAO GERALDO I</option>
      <option value="SAO GERALDO II">PSF SAO GERALDO II</option>
      <option value="TAUAZINHO I">PSF TAUAZINHO I</option>
      <option value="TAUAZINHO II">PSF TAUAZINHO II</option>
      <option value="ALDEOTA I">PSF ALDEOTA I</option>
      <option value="ALDEOTA II">PSF ALDEOTA II</option>
      <option value="CENTRO">PSF CENTRO</option>
      <option value="COLIBRIS">PSF COLIBRIS</option>
      <option value="ALTO NELANDIA">PSF ALTO NELANDIA</option>
      <option value="JOSE OSIMO">PSF JOSE OSIMO</option>
      <option value="INHAMUNS">PSF INHAMUNS</option>
      <option value="GUARIBAS">PSF GUARIBAS</option>
      <option value="MARRECAS">PSF MARRECAS</option>
      <option value="MARRUAS">PSF MARRUAS</option>
      <option value="SANTA LUZIA">PSF SANTA LUZIA</option>
      <option value="SANTA TEREZA I">PSF SANTA TEREZA I</option>
      <option value="SANTA TEREZA II">PSF SANTA TEREZA II</option>
      <option value="SANTANA">PSF SANTANA</option>
      <option value="TRICI">PSF TRICI</option>
      <option value="VILA JOAQUIM MOREIRA">PSF VILA JOAQUIM MOREIRA</option>
      <option value="BARRA NOVA">PSF BARRA NOVA</option>
      <option value="CARRAPATEIRAS">PSF CARRAPATEIRAS</option>

    </select>

    <label>Local do Procedimento:</label>
    <select id="local" required>
      <option value="">Selecione o local de atendimento...</option>
      <option value="HOSPITAL DR. ALBERTO FEITOSA LIMA">HOSPITAL DR. ALBERTO FEITOSA LIMA</option>
    </select>

    <label>Profissional Responsável:</label>
    <select id="profissional" required>
      <option value="">Selecione o Profissional...</option>
      <option value="DR. CLEAN">DR. CLEAN</option>
      <option value="DR. VELOSO">DR. VELOSO</option>
      <option value="DR. PEDRO LINS">DR. PEDRO LINS</option>
      <option value="DR. VALDENOR">DR. VALDENOR</option>
      <option value="DR. DIÓGENES">DR. DIÓGENES</option>
      <option value="DR. LEANDRO">DR. LEANDRO</option>
    </select>

    <label>Cirurgia/Procedimento:</label>
    <input type="text" id="especialidade" required />

    <label>Data do Procedimento:</label>
    <input type="date" id="dataConsulta" required />

    <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
      <button type="button" onclick="gerarComprovante()">Gerar Comprovante</button>
      <button type="button" onclick="gerarPDF()">Baixar PDF</button>
    </div>
  </form>

  <div id="output"></div>

  <script>
    function gerarComprovante() {
      let nome = document.getElementById("nome").value;
      let nomeMae = document.getElementById("nomeMae").value;
      let nascimentoISO = document.getElementById("nascimento").value;
      let nascimento = nascimentoISO.split("-").reverse().join("/");
      let contato = document.getElementById("contato").value;
      let endereco = document.getElementById("endereco").value;
      let local = document.getElementById("local").value;
      let profissional = document.getElementById("profissional").value;
      let especialidade = document.getElementById("especialidade").value;
      let dataConsultaISO = document.getElementById("dataConsulta").value;
      let dataConsulta = dataConsultaISO.split("-").reverse().join("/");

      let horarioAtual = new Date();
      let dataHoraFormatada = horarioAtual.toLocaleDateString('pt-BR') + ' - ' +
                              horarioAtual.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      let observacoesPadrao = `
      - Paciente agendado para cirurgia eletiva conforme protocolo.<br>
      - Jejum de 8h iniciado corretamente.<br>
      - Avaliação clínica e exames pré-operatórios em dia.<br>
      - Anamnese completa e atualizada.<br>
      - Termo de consentimento informado assinado.<br>
      - Paciente sem intercorrências clínicas no pré-operatório.<br>
      - Sinais vitais estáveis na admissão.<br>
      - Retirada de acessórios e objetos metálicos confirmada.<br>
      - Via venosa periférica instalada com sucesso.<br>
      - Confirmação de NPO e preparo intestinal (se necessário).<br>
      - Cirurgia confirmada com equipe e centro cirúrgico.<br>
      - Avaliação pré-anestésica realizada sem contraindicações.<br>
      - Identificação e lado cirúrgico corretamente marcados.<br>
      - Paciente sem sinais de infecção ativa.<br>
      - Orientações prévias reforçadas no acolhimento.<br>
      - Alergias e comorbidades revisadas e anotadas.<br>
      - Prontuário revisado e completo na unidade.<br>
      - Paciente tranquilo, ciente do procedimento e colaborativo.<br>
      
    `;
      let comprovante = `
        <div class='comprovante'>
          <div class='logo'>
            <img src='imagens/logo.JPG' alt='Logo' />
          </div>
          <p class='header1'>SECRETARIA MUNICIPAL DE SAÚDE</p>
          <p class='header'>AV ODILON AGUIAR, 77, CENTRO, TAUÁ - CE</p>
          <p class='titulo'>Comprovante de Agendamento</p>
          <div class='linha'></div>
          <p><strong>Nome:</strong> ${nome}</p>
          <p><strong>Nome da Mãe:</strong> ${nomeMae}</p>
          <p><strong>Data de Nascimento:</strong> ${nascimento}</p>
          <p><strong>Contato:</strong> ${contato}</p>
          <p><strong>ESF:</strong> ${endereco}</p>
          <div class='linha'></div>
          <p><strong>Local do Procedimento:</strong> ${local}</p>
          <p><strong>Data do Agendamento:</strong> ${dataConsulta}</p>
          <p><strong>Cirurgia/Procedimento:</strong> ${especialidade}</p>
          <p><strong>Profissional:</strong> ${profissional}</p>
          <div class='linha'></div>
          <p><strong>Observações Pré-Operatórias:</strong></p>
          <p>${observacoesPadrao}</p>
          <div class='linha'></div>
          <div class='rodape'>
            <span class='marca-info'>SMS - TAUÁ</span>
            <span class='horario-gerado'>Emitido em: ${dataHoraFormatada}</span>
          </div>
        </div>
      `;

      document.getElementById("output").innerHTML = comprovante;
      localStorage.setItem("ultimoComprovante", comprovante);
    }

    function gerarPDF() {
      const { jsPDF } = window.jspdf;
      const output = document.getElementById("output");

      const estiloOriginal = output.getAttribute("style");
      output.setAttribute("style", "box-shadow: none; border-radius: 0; margin: 0; padding: 0; background: white;");

      const imagens = output.getElementsByTagName("img");
      let imagensCarregadas = 0;

      function renderizarPDF() {
        html2canvas(output, {
          backgroundColor: "#ffffff",
          scale: 3
        }).then((canvas) => {
          const imgData = canvas.toDataURL("image/png");
          const pdf = new jsPDF("p", "mm", "a4");

          const margem = 10;
          const larguraPagina = pdf.internal.pageSize.getWidth() - margem * 2;
          const alturaImagem = (canvas.height * larguraPagina) / canvas.width;

          pdf.addImage(imgData, "PNG", margem, margem, larguraPagina, alturaImagem);
          pdf.save("comprovante_agendamento.pdf");

          if (estiloOriginal) {
            output.setAttribute("style", estiloOriginal);
          } else {
            output.removeAttribute("style");
          }
        });
      }

      if (imagens.length === 0) {
        renderizarPDF();
      } else {
        for (let i = 0; i < imagens.length; i++) {
          if (imagens[i].complete) {
            imagensCarregadas++;
            if (imagensCarregadas === imagens.length) renderizarPDF();
          } else {
            imagens[i].onload = () => {
              imagensCarregadas++;
              if (imagensCarregadas === imagens.length) renderizarPDF();
            };
          }
        }
      }
    }

    window.onload = function () {
      let ultimoComprovante = localStorage.getItem("ultimoComprovante");
      if (ultimoComprovante) {
        document.getElementById("output").innerHTML = ultimoComprovante;
      }
    };
  </script>
</body>
</html>
